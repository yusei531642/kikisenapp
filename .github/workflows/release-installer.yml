name: Build Release Installer

on:
  release:
    types:
      - published

jobs:
  build-installer:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: powershell

      - name: Build Installer
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-installer.ps1
        env:
          KIKISENAPP_SIGN_PFX_BASE64: ${{ secrets.KIKISENAPP_SIGN_PFX_BASE64 }}
          KIKISENAPP_SIGN_PFX_PASSWORD: ${{ secrets.KIKISENAPP_SIGN_PFX_PASSWORD }}

      - name: Upload Installer To Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KikisenApp-Setup.exe
          overwrite_files: true
